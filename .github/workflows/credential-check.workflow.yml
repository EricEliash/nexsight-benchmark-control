name: Read-only benchmark credential check

'on':
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: Run one already-authorized exact-owned positive GET only
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: read-only-benchmark-credential-check
  cancel-in-progress: false

jobs:
  check:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      inputs.confirm_read_only == true
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read reviewed check source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: One exact-owned read; no cleanup or arming
        shell: bash
        env:
          NEXSIGHT_TEARDOWN_ACCESS_KEY: ${{ secrets.NEXSIGHT_TEARDOWN_ACCESS_KEY }}
          NEXSIGHT_TEARDOWN_SECRET_KEY: ${{ secrets.NEXSIGHT_TEARDOWN_SECRET_KEY }}
          NEXSIGHT_TEARDOWN_EXPECTED_PROJECT: ${{ secrets.NEXSIGHT_TEARDOWN_EXPECTED_PROJECT }}
          NEXSIGHT_CREDENTIAL_CHECK_CONFIG_JSON: ${{ secrets.NEXSIGHT_CREDENTIAL_CHECK_CONFIG_JSON }}
        run: python3 -I -B control-live/verify_credential_readonly.py --execute

# Keep the cleanup controller disabled/disarmed during credential replacement.
# No schedule, cleanup ledger, source bundle, resource IDs or secrets belong here.
